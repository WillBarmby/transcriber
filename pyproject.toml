[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tranpro"
version = "0.2.0a1"
description = "A local-first transcript library and one-shot transcription CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Will Barmby" }]
keywords = ["audio", "cli", "summarization", "transcription"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "google-api-python-client>=2,<3",
  "google-auth-oauthlib>=1,<2",
  "keyring>=25,<26",
  "openai>=2,<3",
  "parakeet-mlx>=0.6,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "platformdirs>=4.3,<5",
  "rich>=13.8,<16",
  "Send2Trash>=1.8,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
diarization = [
  "mlx-audio>=0.6.2,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "twine>=6,<7",
  "types-Send2Trash>=1.8,<2",
]

[project.urls]
Changelog = "https://github.com/WillBarmby/transcriber/blob/main/CHANGELOG.md"
Homepage = "https://github.com/WillBarmby/transcriber"
Issues = "https://github.com/WillBarmby/transcriber/issues"
Repository = "https://github.com/WillBarmby/transcriber.git"

[project.scripts]
tp = "tranpro.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["tranpro*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["scripts", "src/transcriber"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tranpro"]

[[tool.mypy.overrides]]
module = [
  "google.auth",
  "google.auth.*",
  "google.oauth2",
  "google.oauth2.*",
  "google_auth_oauthlib",
  "google_auth_oauthlib.*",
  "googleapiclient",
  "googleapiclient.*",
  "keyring",
  "openai",
  "openai.*",
  "mlx_audio",
  "mlx_audio.*",
]
follow_imports = "skip"
ignore_missing_imports = true
